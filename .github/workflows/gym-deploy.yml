name: Gym deploy

# Runs on the gym host's self-hosted runner (label excel-gym) whenever gym code lands on main.
# The host pulls; nothing reaches into it. deploy.sh smoke-tests a canary against real Excel before
# replacing the live gym, so a bad change leaves the old gym running.
on:
  push:
    branches: [main]
    paths:
      - "gym/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/gym-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback:
        description: Restart the previous gym image instead of deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gym-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, excel-gym]
    # Add required reviewers to this environment in repo settings for a human gate on deploys.
    environment: gym
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: gym/deploy/deploy.sh ${{ inputs.rollback && '--rollback' || '' }}
