name: Engine access
description: >
  Lets cargo fetch the private rustsheet engine repo with a read-only deploy key, when one is set.
  Without a key (a public engine repo) this does nothing.
inputs:
  ssh-key:
    description: Private half of a read-only deploy key on steveash/rustsheet
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.ssh-key != ''
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ inputs.ssh-key }}
    - if: inputs.ssh-key != ''
      shell: bash
      run: git config --global url."git@github.com:steveash/rustsheet".insteadOf "https://github.com/steveash/rustsheet"
